.actions { display: flex; gap: 8px; }

button.ghost { flex: 0 0 auto; font: 600 16px/1 var(--font-body); border-radius: 8px; padding: 14px 16px; background: transparent; color: var(--ink); border: 1.5px solid var(--line); cursor: pointer; }

</div>

  function makeLabels() { stage.querySelectorAll('.lab').forEach(e => e.remove()); labels.length = 0; const r = ROUNDS[R];
    const add = (tex, cls) => { const e = document.createElement('div'); e.className = 'lab'; e.dataset.k = cls; e.innerHTML = tex; stage.append(e); labels.push(e); return e; };
    add('\\(y\\)', 'ly'); add('\\(u\\)', 'lu'); add(r.stokes ? '\\(u=U\\)' : '\\(U\\)', 'u1'); if (r.ghostT) add('\\(t=1\\)', 'ghost'); if (r.pressure) add('\\(\\nabla p\\)', 'press'); typeset(labels); placeLabels(); }
  function placeLabels() { const r = ROUNDS[R]; if (!G) return; labels.forEach(e => { const k = e.dataset.k;
    if (k === 'ly') { e.style.left = (G.padL - 16) + 'px'; e.style.top = (r.stokes ? G.top + 10 : G.top + 24) + 'px'; }
    else if (k === 'lu') { e.style.left = (G.x(0) + 14) + 'px'; e.style.top = (G.bot - 12) + 'px'; }
    else if (k === 'u1') { e.style.left = (G.x(1) + (r.stokes ? -32 : 24)) + 'px'; e.style.top = (r.stokes ? G.top + 10 : G.top - 9) + 'px'; }
    else if (k === 'ghost') { e.style.left = G.x(0.2) + 'px'; e.style.top = G.y(0.9) + 'px'; }
    else if (k === 'press') { e.style.left = (W - 34) + 'px'; e.style.top = ((G.top + G.bot) / 2 - 18) + 'px'; } }); }
  // ---------- drawing input ----------
  let drawing = false;
  const pos = ev => { const b = cv.getBoundingClientRect(); return [ev.clientX - b.left, ev.clientY - b.top]; };
  cv.addEventListener('pointerdown', ev => { if (st.phase !== 'draw') return; drawing = true; cv.setPointerCapture(ev.pointerId); st.pts = [pos(ev)]; $('hint').hidden = true; draw(); });
  cv.addEventListener('pointermove', ev => { if (!drawing) return; const p = pos(ev); const q = st.pts[st.pts.length - 1]; if (Math.hypot(p[0] - q[0], p[1] - q[1]) < 2) return; st.pts.push(p); if (st.pts.length % 6 === 0) snd.scribble(); draw(); });
  const stop = () => { if (!drawing) return; drawing = false; $('go').disabled = st.pts.length < 8; };
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
  // sketch -> u(y) on NB+1 bins, pinned to the anchors
  function sample() {
    const r = ROUNDS[R], bins = Array.from({ length: NB + 1 }, () => []);
    st.pts.forEach(([px, py]) => { const yy = G.yOf(py); const i = Math.round(yy / r.ymax * NB); if (i >= 0 && i <= NB) bins[i].push(G.uOf(px)); });
    const u = bins.map(b => b.length ? b.reduce((a, v) => a + v, 0) / b.length : null);
    const covered = u.filter(v => v !== null).length / (NB + 1);
    u[0] = r.walls.bot; u[NB] = r.stokes ? (r.far || 0) : r.walls.top;
    for (let i = 1; i < NB; i++) if (u[i] === null) { let j = i + 1; while (u[j] === null) j++; const a = u[i - 1], b = u[j]; for (let k = i; k < j; k++) u[k] = a + (b - a) * (k - i + 1) / (j - i + 1); i = j; }
    return { u, covered };
  }
  function renderDots() { const box = $('dots'); box.innerHTML = ''; ROUNDS.forEach((_, i) => { const e = document.createElement('span'); e.className = 'dot'; e.dataset.s = results[i] === null ? (i === R ? 'now' : '') : results[i] >= 8 ? 'right' : results[i] >= 4 ? 'half' : 'wrong'; box.append(e); }); $('total').textContent = results.reduce((a, s) => a + (s || 0), 0); }
  function load(i) {
    R = i; st = { phase: 'draw', pts: [], us: null }; const r = ROUNDS[R];
    $('final').hidden = true; $('card').hidden = false; $('stage').hidden = false; $('brief').hidden = false; $('legend').hidden = true; $('hint').hidden = false;
    $('title').textContent = 'Round ' + (R + 1) + ': ' + r.title; $('brief').innerHTML = r.brief;
    $('go').disabled = true; $('go').hidden = false; $('clear').hidden = false; $('next').hidden = true; $('result').textContent = ''; $('result').className = 'result'; $('debrief').hidden = true; $('debrief').innerHTML = '';
    renderDots(); size(); makeLabels(); typeset([$('brief'), $('hint')]);
  }
  $('clear').addEventListener('click', () => { if (st.phase !== 'draw') return; st.pts = []; $('go').disabled = true; $('hint').hidden = false; draw(); });
  $('go').addEventListener('click', () => {
    if (st.phase !== 'draw' || st.pts.length < 8) return; const r = ROUNDS[R];
    const { u, covered } = sample(); if (covered < 0.6) { $('result').textContent = 'Draw the whole profile, from the bottom wall to the top.'; $('result').className = 'result no'; return; }
    st.us = u; st.phase = 'done'; st.pts = [];
    const ue = u.map((_, i) => r.exact(r.stokes ? r.ymax * i / NB : i / NB));
    const scale = Math.max(1, ...ue.map(Math.abs));
    const err = Math.sqrt(u.reduce((a, v, i) => a + (v - ue[i]) ** 2, 0) / (NB + 1)) / scale;
    const score = Math.max(0, Math.min(10, Math.round(10 * (1 - err / 0.32)))); results[R] = score;
    const note = r.feats(u);
    if (score >= 8) snd.ok(); else if (score >= 4) snd.mid(); else snd.no();
    $('result').innerHTML = (score >= 8 ? 'Nice. ' : score >= 4 ? 'Close. ' : 'Not this one. ') + '+' + score + ' · RMS error ' + err.toFixed(2) + '\\(\\,U\\)' + (note ? '<br>' + note : '');
    $('result').className = 'result ' + (score >= 8 ? 'ok' : score >= 4 ? 'mid' : 'no');
    const db = $('debrief'); db.innerHTML = r.debrief.map(s => '<p>' + s + '</p>').join(''); db.hidden = false; $('legend').hidden = false;
    $('go').hidden = true; $('clear').hidden = true; $('next').hidden = false; $('next').textContent = R < ROUNDS.length - 1 ? 'Next round' : 'See total';
    renderDots(); draw(); typeset([db, $('result')]);
  });
  $('next').addEventListener('click', () => {
    if (R < ROUNDS.length - 1) load(R + 1);
    else { const tot = results.reduce((a, s) => a + (s || 0), 0), fr = tot / (ROUNDS.length * 10);
      $('emo').textContent = fr >= 0.9 ? '🏆✍️' : fr >= 0.6 ? '✍️' : fr >= 0.3 ? '📝' : '🖍️'; $('emo').className = 'emo' + (fr >= 0.6 ? ' draw' : '');
      $('card').hidden = true; $('stage').hidden = true; $('brief').hidden = true; $('legend').hidden = true; $('final').hidden = false; $('title').textContent = 'Finished'; snd.final(fr); $('finalScore').textContent = tot; window.scrollTo(0, 0); }
  });
  $('again').addEventListener('click', () => { results = ROUNDS.map(() => null); load(0); });
  window.addEventListener('resize', size);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  load(0);
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(() => { typeset([document.querySelector('.app')]); });
})();
</script>
