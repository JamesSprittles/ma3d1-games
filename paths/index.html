    if (r.cands) {
      r.cands.forEach(c => {
        const col = css(CCOL[c.k]); ctx.strokeStyle = col; ctx.lineWidth = st.choice === c.k ? 4 : 2.5;
        ctx.globalAlpha = st.phase === 'predict' || st.choice === c.k || c.ok ? 0.9 : 0.35; polyline(c.pts); ctx.globalAlpha = 1;
      });
    }
    // streamline through each particle, now (dashed); trails; particles
    st.parts.forEach((p, i) => {
      ctx.strokeStyle = cFlow; ctx.lineWidth = 2; ctx.setLineDash([7, 6]); ctx.globalAlpha = i ? 0.6 : 0.9;
      streamline(p.pos, st.t).forEach(s => polyline(s)); ctx.setLineDash([]); ctx.globalAlpha = 1;
    });
    st.parts.forEach((p, i) => {
      if (p.trail.length > 1) { ctx.strokeStyle = cPath; ctx.lineWidth = 3.5; if (i) ctx.setLineDash([2, 4]); polyline(p.trail); ctx.setLineDash([]); }
      ctx.fillStyle = i ? css('--surface') : cPath; ctx.strokeStyle = cPath; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(sx(p.pos.x), sy(p.pos.y), 7, 0, 2 * PI); ctx.fill(); ctx.stroke();
    });
    $('clock').textContent = st.t.toFixed(2);
    $('phase').textContent = st.phase === 'predict' ? (r.cands ? 'Pick A, B or C' : 'Predict, then release') : st.phase === 'run' ? 'Moving with the fluid' : 'Done';
  }
  // letter labels at the end of each candidate curve
  const labels = [];
  function makeLabels() {
    labels.length = 0; stage.querySelectorAll('.lab').forEach(e => e.remove());
    (ROUNDS[R].cands || []).forEach(c => { const e = document.createElement('div'); e.className = 'lab'; e.textContent = c.k; e.style.background = css(CCOL[c.k]); stage.append(e); labels.push([c, e]); });
  }
  function placeLabels() {
    labels.forEach(([c, e]) => {
      const d = ROUNDS[R].dom, m = 0.42; // keep labels clear of the status bar and the edges
      let q = c.pts[c.pts.length - 1];
      for (let i = c.pts.length - 1; i >= 0; i--) { const p = c.pts[i]; if (p[0] < d.x1 - m && p[1] < d.y1 - m && p[1] > d.y0 + m) { q = p; break; } }
      e.style.left = (sx(q[0]) + 14) + 'px'; e.style.top = (sy(q[1]) - 6) + 'px';
    });
  }
  function renderDots() {
    const box = $('dots'); box.innerHTML = '';
    ROUNDS.forEach((_, i) => { const e = document.createElement('span'); e.className = 'dot'; e.dataset.s = results[i] === null ? (i === R ? 'now' : '') : results[i] ? 'right' : 'wrong'; box.append(e); });
    $('total').textContent = results.reduce((a, s) => a + (s ? 10 : 0), 0);
  }
  function showFinal(on) { for (const sel of ['#stage', '.legend', '#brief', '.ckey', '.graphs', '#pill']) document.querySelectorAll(sel).forEach(e => e.hidden = on); if (on) { $('title').textContent = 'Finished'; window.scrollTo(0, 0); } }
  function load(i) {
    R = i; st = fresh(); const r = ROUNDS[R];
    $('final').hidden = true; $('card').hidden = false; showFinal(false);
    $('title').textContent = 'Round ' + (R + 1) + ': ' + r.title; $('brief').innerHTML = r.brief; $('q').textContent = r.q;
    const box = $('choices'); box.innerHTML = '';
    const items = r.cands ? r.cands.map(c => ({ k: c.k, v: c.k, sw: true })) : r.opts.map(o => ({ k: o.k, v: o.v }));
    items.forEach(it => {
      const b = document.createElement('button'); b.className = 'choice'; b.type = 'button'; b.dataset.v = it.v; b.setAttribute('aria-pressed', 'false');
      b.innerHTML = (it.sw ? '<span class="sw" style="background:' + css(CCOL[it.k]) + '">' + it.k + '</span>' : '') + (it.sw ? 'Curve ' + it.k : it.k);
      b.onclick = () => { if (st.phase !== 'predict') return; box.querySelectorAll('.choice').forEach(c => c.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); st.choice = it.v; $('go').disabled = false; draw(); };
      box.append(b);
    });
    $('go').disabled = true; $('go').hidden = false; $('next').hidden = true;
    $('result').textContent = ''; $('result').className = 'result'; $('debrief').hidden = true; $('debrief').innerHTML = '';
    makeLabels(); renderDots(); size(); typeset([$('brief')]);
  }

  $('go').addEventListener('click', () => {
    if (st.phase !== 'predict' || st.choice === null) return;
    const r = ROUNDS[R]; st.phase = 'run'; st.t = r.t0;
    $('go').disabled = true; document.querySelectorAll('.choice').forEach(c => c.disabled = true);
    snd.whoosh();
    let last = performance.now();
    function step(now) {
      const real = Math.min(0.05, (now - last) / 1000); last = now;
      const dt = reduceMotion ? r.T : real * r.speed, sub = Math.max(1, Math.ceil(dt / 0.004)), h = dt / sub;
      for (let k = 0; k < sub; k++) {
        st.parts.forEach(p => {
          if (st.t < p.tau) return;
          if (!p.trail.length) p.trail.push([p.pos.x, p.pos.y]);
          let { x, y } = p.pos; const t = st.t, f = r.vel;
          const k1 = f(x, y, t), k2 = f(x + h / 2 * k1[0], y + h / 2 * k1[1], t + h / 2), k3 = f(x + h / 2 * k2[0], y + h / 2 * k2[1], t + h / 2), k4 = f(x + h * k3[0], y + h * k3[1], t + h);
          p.pos = { x: x + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]), y: y + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) };
        });
        st.t += h;
      }
      st.parts.forEach(p => { if (p.trail.length) p.trail.push([p.pos.x, p.pos.y]); });
      draw();
      if (st.t < r.t0 + r.T) requestAnimationFrame(step); else finish();
    }
    requestAnimationFrame(step);
  });

  function finish() {
    st.phase = 'done'; const r = ROUNDS[R];
    const truth = r.cands ? r.cands.find(c => c.ok).k : r.truth, ok = st.choice === truth; results[R] = ok; if (ok) snd.ok(); else snd.no();
    document.querySelectorAll('.choice').forEach(c => { if (c.dataset.v === truth) c.classList.add('right'); else if (c.dataset.v === st.choice) c.classList.add('wrong'); });
    $('result').textContent = ok ? 'Right. +10' : 'Not this time. +0'; $('result').className = 'result ' + (ok ? 'ok' : 'no');
    const db = $('debrief'); db.innerHTML = r.debrief.map(s => '<p>' + s + '</p>').join(''); db.hidden = false;
    $('go').hidden = true; $('next').hidden = false; $('next').textContent = R < ROUNDS.length - 1 ? 'Next round' : 'See total';
    renderDots(); draw(); typeset([db]);
  }
  $('next').addEventListener('click', () => {
    if (R < ROUNDS.length - 1) load(R + 1);
    else {
      const tot = results.reduce((a, s) => a + (s ? 10 : 0), 0), fr = tot / (ROUNDS.length * 10);
      const v = fr === 1 ? ['🏄', 'Perfect. You always know which way the water is going.'] : fr >= 0.7 ? ['🛶', 'Good. One current caught you out.'] : fr >= 0.4 ? ['🌊🤷', 'Swept along. Remember: the arrows you see now are not the arrows you will meet.'] : ['🫧', 'Lost at sea. Re-read §2.5: particle paths integrate the velocity in time.'];
      $('emo').textContent = v[0]; $('emo').className = 'emo' + (fr >= 0.7 ? ' go' : ''); 
      $('card').hidden = true; $('final').hidden = false; showFinal(true); snd.final(fr); $('finalScore').textContent = tot; typeset([$('final')]);
    }
  });
  $('again').addEventListener('click', () => { results = ROUNDS.map(() => null); load(0); });
  window.addEventListener('resize', size);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  st = fresh(); load(0);
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(() => typeset([document.querySelector('.app')]));
})();
</script>
</body></html>
