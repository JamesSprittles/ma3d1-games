<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">
<title>Spin the Paddle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">

<style>
/* Layout: phone column. Round card, flow canvas with the paddle, a three-way prediction, then the reveal. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #18202C; --muted: #566070; --line: #D5DBE4;
  --flow: #1F5FA8; --paddle: #C24A00; --key: #C0392B; --good: #0B7A55; --wall: #8A6D3B;
  --font-display: "Source Serif 4", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151B; --surface: #1A2029; --ink: #E7EBF1; --muted: #9AA5B5; --line: #2E3744;
    --flow: #79AEEA; --paddle: #FF9A5C; --key: #F0756A; --good: #4CC79A; --wall: #B8975E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151B; --surface: #1A2029; --ink: #E7EBF1; --muted: #9AA5B5; --line: #2E3744;
  --flow: #79AEEA; --paddle: #FF9A5C; --key: #F0756A; --good: #4CC79A; --wall: #B8975E; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.4; }
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 100%; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: transparent; }
.dot[data-s="now"] { border-color: var(--ink); }
.dot[data-s="right"] { background: var(--good); border-color: var(--good); }
.dot[data-s="wrong"] { background: var(--key); border-color: var(--key); }
.score { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
.score b { color: var(--ink); }
.sndbtn { font-size: 18px; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; margin-left: 8px; cursor: pointer; vertical-align: middle; }

h1 { font-family: var(--font-display); font-weight: 600; font-size: 24px; margin: 0; text-wrap: balance; }
.brief { margin: 0; color: var(--muted); font-size: 16px; min-width: 0; }
.stage { position: relative; align-self: center; border-radius: 10px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); touch-action: none; }
canvas { display: block; }
.hint { position: absolute; left: 8px; top: 6px; font-size: 15px; color: var(--muted); pointer-events: none; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 1px 6px; border-radius: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.q { margin: 0; font-weight: 600; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choice { font: 600 16px/1.2 var(--font-body); padding: 12px 6px; border-radius: 8px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.choice[aria-pressed="true"] { border-color: var(--ink); background: color-mix(in srgb, var(--ink) 8%, transparent); }
.choice svg { width: 34px; height: 34px; }
.choice.right { border-color: var(--good); }
.choice.wrong { border-color: var(--key); }
.actions { display: flex; gap: 8px; }
button.primary { flex: 1; font: 700 17px/1 var(--font-body); border-radius: 8px; padding: 14px 16px; background: var(--ink); color: var(--surface); border: 1px solid transparent; cursor: pointer; }
button.primary:disabled { opacity: .4; cursor: default; }
button:focus-visible, .choice:focus-visible { outline: 3px solid var(--flow); outline-offset: 2px; }
.result { margin: 0; font-size: 16px; min-height: 1.4em; }
.result.ok { color: var(--good); font-weight: 600; }
.result.no { color: var(--key); font-weight: 600; }
.debrief { border-top: 1px solid var(--line); padding-top: 10px; font-size: 16px; display: flex; flex-direction: column; gap: 6px; }
.debrief p { margin: 0; }
.final { text-align: center; gap: 14px; padding-block: 22px; }
.final .big { font-size: 56px !important; }
.emo { font-size: 110px; line-height: 1.15; }
.emo.spin { display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
@media (prefers-reduced-motion: reduce) { .emo.spin { animation: none; } }
.verdict { margin: 0; font-weight: 600; }
.final .big { font-family: var(--font-display); font-size: 44px; font-variant-numeric: tabular-nums; }
.foot { font-size: 13.5px; color: var(--muted); text-align: center; }
</style>

<div class="app">
  <div class="top">
    <div class="dots" id="dots" aria-label="Rounds"></div>
    <div class="score" aria-live="polite">Score <b id="total">0</b> / <span id="max"></span> <button class="sndbtn" id="sndBtn" type="button">🔊</button></div>
  </div>
  <h1 id="title"></h1>
  <p class="brief" id="brief"></p>

  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="Flow field with a small paddle wheel"></canvas>
    <div class="hint" id="hint"></div>
  </div>

  <section class="card" id="card">
    <p class="q" id="q">Will the paddle wheel spin?</p>
    <div class="choices" id="choices" role="group" aria-label="Your prediction">
      <button class="choice" data-v="1" aria-pressed="false"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M8 17a9 9 0 1 0 4-7.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 4l-1 6 6 0" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>Anticlockwise</button>
      <button class="choice" data-v="0" aria-pressed="false"><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M17 8v18M8 17h18" stroke="currentColor" stroke-width="2.5"/></svg>Doesn't spin</button>
      <button class="choice" data-v="-1" aria-pressed="false"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M26 17a9 9 0 1 1-4-7.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M22 4l1 6-6 0" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>Clockwise</button>
    </div>
    <div class="actions">
      <button class="primary" id="go" disabled>Release the paddle</button>
      <button class="primary" id="next" hidden>Next</button>
    </div>
    <p class="result" id="result" aria-live="polite"></p>
    <div class="debrief" id="debrief" hidden></div>
  </section>

  <section class="card final" id="final" hidden>
    <div class="emo" id="emo" aria-hidden="true"></div>
    <div>Your total</div>
    <div class="big" id="finalScore">0</div>
    <div class="actions"><button class="primary" id="again">Play again</button></div>
  </section>

  <p class="foot">MA3D1 Fluid Dynamics · Chapter 2, vorticity · prototype</p>
</div>

<script>
(function () {
  const PI = Math.PI;
  // sign: +1 anticlockwise (omega > 0), 0 none, -1 clockwise. omega(x,y) is the z-vorticity at the paddle.
  const ROUNDS = [
    {
      title: 'A point vortex', brief: 'The flow is \\(\\underline{u}=(-y,x)/r^2\\): circular streamlines, anticlockwise, faster near the centre. Will the paddle spin as it goes round?',
      dom: { x0: -1.6, x1: 1.6, y0: -1.6, y1: 1.6 }, pos: { x: 1.0, y: 0 }, place: false, T: 2 * PI, speed: 1.2,
      vel: (x, y) => { const r2 = x * x + y * y; return [-y / r2, x / r2]; }, omega: (x, y) => 0,
      debrief: ['\\(\\omega=0\\) for \\(r>0\\): the paddle goes round the vortex without turning. Its blades keep pointing the same way, like a compass needle.', 'The inner blade is in faster fluid, which would turn the wheel clockwise; the orbit itself carries the wheel round anticlockwise. For \\(u_\\theta\\propto1/r\\) the two cancel exactly. Circular streamlines can be irrotational.']
    },
    {
      title: 'Looks like shear', brief: 'The flow is \\(\\underline{u}=(y,x)\\). It looks like a shear flow with the roles of \\(x\\) and \\(y\\) swapped. Will the paddle spin?',
      dom: { x0: -1.6, x1: 1.6, y0: -1.6, y1: 1.6 }, pos: { x: -0.6, y: 0.9 }, place: false, T: 1.6, speed: 0.8,
      vel: (x, y) => [y, x], omega: (x, y) => 0,
      debrief: ['\\(\\omega=\\partial v/\\partial x-\\partial u/\\partial y=1-1=0\\): no spin. This is the pure strain \\((x,-y)\\) turned through \\(\\pi/4\\): the element is stretched along one diagonal and squashed along the other.', 'Simple shear \\((y,0)\\) has \\(\\omega=-1\\): half rotation, half strain. Adding the \\(x\\) to the second component cancels the rotation and leaves pure strain.']
    },
    {
      title: 'Work it out', brief: 'The flow is \\(\\underline{u}=(xy,\\,-\\tfrac12y^2)\\). The paddle sits at \\((0.8,\\,0.5)\\). Compute \\(\\omega\\) there before you answer.',
      dom: { x0: -1.0, x1: 2.2, y0: -1.2, y1: 1.2 }, pos: { x: 0.8, y: 0.5 }, place: false, T: 1.4, speed: 0.6,
      vel: (x, y) => [x * y, -0.5 * y * y], omega: (x, y) => -x,
      wtxt: '\\(\\omega=-x=-0.8\\) at the paddle. ',
      debrief: ['\\(\\omega=\\partial v/\\partial x-\\partial u/\\partial y=0-x=-x\\). At \\(x=0.8\\) that is \\(-0.8\\): clockwise, and it strengthens as the paddle drifts to larger \\(x\\).', 'Check: \\(\\nabla\\cdot\\underline{u}=y-y=0\\), so this is an incompressible flow. The sign of \\(\\omega\\) flips across \\(x=0\\): the same wheel placed at \\(x<0\\) would turn the other way.']
    },
    {
      title: 'Work it out again', brief: 'The flow is \\(\\underline{u}=(x^2-y^2,\\,-2xy)\\). The paddle sits at \\((0.6,\\,0.6)\\), where it is about to be swept downwards and round. Compute \\(\\omega\\) before you answer.',
      dom: { x0: -1.0, x1: 2.2, y0: -1.2, y1: 1.2 }, pos: { x: 0.6, y: 0.6 }, place: false, T: 1.2, speed: 0.5,
      vel: (x, y) => [x * x - y * y, -2 * x * y], omega: (x, y) => 0,
      debrief: ['\\(\\omega=\\partial v/\\partial x-\\partial u/\\partial y=-2y-(-2y)=0\\) everywhere: the path bends but the wheel never turns.', 'This is the potential flow \\(\\underline{u}=\\nabla\\phi\\) with \\(\\phi=\\tfrac13x^3-xy^2\\), and \\(\\nabla\\times\\nabla\\phi=\\underline{0}\\) always. Curved paths tell you nothing about vorticity; only the local velocity gradients do.']
    },
    {
      title: 'Flow in a channel', brief: 'Plane Poiseuille flow \\(\\underline{u}=(1-y^2,\\,0)\\) between walls at \\(y=\\pm1\\). <b>Tap to place the paddle</b> where you like, then predict.',
      dom: { x0: -2, x1: 2, y0: -1.2, y1: 1.2 }, pos: { x: -1.5, y: 0.5 }, place: true, walls: [-1, 1], T: 3.2, speed: 1,
      vel: (x, y) => [Math.abs(y) < 1 ? 1 - y * y : 0, 0], omega: (x, y) => 2 * y,
      debrief: ['\\(\\omega=-\\partial u/\\partial y=2y\\): anticlockwise in the upper half, clockwise in the lower half, zero on the centreline.', 'The blade nearer the centreline sits in faster fluid and is pushed ahead, which sets the sense of rotation. On the centreline both blades see the same speed and the wheel only translates.']
    },
    {
      title: 'A faster vortex', brief: 'The flow is \\(\\underline{u}=(-y,x)/r^3\\), so \\(u_\\theta=1/r^2\\): circular streamlines, anticlockwise, but falling off faster with \\(r\\) than the point vortex. Will the paddle spin as it goes round, and which way?',
      dom: { x0: -1.6, x1: 1.6, y0: -1.6, y1: 1.6 }, pos: { x: 1.0, y: 0 }, place: false, T: 2 * PI, speed: 1.2,
      vel: (x, y) => { const r3 = Math.pow(x * x + y * y, 1.5); return [-y / r3, x / r3]; }, omega: (x, y) => -1 / Math.pow(x * x + y * y, 1.5), wtxt: '\\(\\omega=-1/r^3=-1\\) at \\(r=1\\). ',
      debrief: ['For \\(\\underline{u}=u_\\theta(r)\\,\\underline{e}_\\theta\\), \\(\\omega=\\dfrac{1}{r}\\dfrac{\\mathrm{d}(ru_\\theta)}{\\mathrm{d}r}\\). With \\(u_\\theta=1/r^2\\), \\(ru_\\theta=1/r\\) decreases, so \\(\\omega=-1/r^3<0\\): the paddle spins <b>clockwise</b> while orbiting anticlockwise. Half a turn per orbit at \\(r=1\\).',
                'The inner blade now sits in fluid so much faster that it wins against the orbit. Compare: \\(u_\\theta\\propto r\\) spins with the orbit, \\(u_\\theta\\propto1/r\\) not at all, \\(u_\\theta\\propto1/r^2\\) against it. The sign of \\(\\mathrm{d}(ru_\\theta)/\\mathrm{d}r\\) decides.']
    }
  ];

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let R = 0, st, results = ROUNDS.map(() => null);
  $('max').textContent = ROUNDS.length * 10;

  function fresh() { const r = ROUNDS[R]; return { pos: { ...r.pos }, choice: null, phase: 'predict', t: 0, p: { ...r.pos }, theta: 0, trail: [] }; }
  function typeset(els) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(els).catch(() => {}); }

  let W = 300, H = 300, scale = 1;
  function size() {
    const d = ROUNDS[R].dom, aspect = (d.x1 - d.x0) / (d.y1 - d.y0);
    const maxW = Math.min(stage.parentElement.clientWidth - 32, 528), maxH = Math.max(220, window.innerHeight * 0.42);
    W = maxW; H = W / aspect; if (H > maxH) { H = maxH; W = H * aspect; }
    W = Math.round(W); H = Math.round(H);
    const dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); scale = W / (d.x1 - d.x0); draw();
  }
  const sx = x => (x - ROUNDS[R].dom.x0) * scale, sy = y => (ROUNDS[R].dom.y1 - y) * scale;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  // ---------- sound (synthesised, no files) ----------
  const snd = (() => {
    let ac = null, on = true;
    try { on = localStorage.getItem('ma3d1-sound') !== 'off'; } catch (e) {}
    const ctxA = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === 'suspended') ac.resume(); return ac; };
    function tone(f0, t0, dur, type, gain, f1) {
      const a = ctxA(); if (!a || !on) return; const o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f0, a.currentTime + t0); if (f1) o.frequency.exponentialRampToValueAtTime(f1, a.currentTime + t0 + dur);
      g.gain.setValueAtTime(0.0001, a.currentTime + t0); g.gain.exponentialRampToValueAtTime(gain || 0.2, a.currentTime + t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + dur);
      o.connect(g).connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + 0.05);
    }
    function noise(t0, dur, gain, f0, f1) {
      const a = ctxA(); if (!a || !on) return; const n = a.sampleRate * dur, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const s = a.createBufferSource(), flt = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; flt.type = 'bandpass'; flt.Q.value = 1.2;
      flt.frequency.setValueAtTime(f0, a.currentTime + t0); flt.frequency.exponentialRampToValueAtTime(f1, a.currentTime + t0 + dur);
      g.gain.setValueAtTime(0.0001, a.currentTime + t0); g.gain.exponentialRampToValueAtTime(gain, a.currentTime + t0 + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + dur);
      s.connect(flt).connect(g).connect(a.destination); s.start(a.currentTime + t0);
    }
    return {
      get on() { return on; },
      toggle() { on = !on; try { localStorage.setItem('ma3d1-sound', on ? 'on' : 'off'); } catch (e) {} if (on) tone(660, 0, 0.12, 'sine', 0.15); return on; },
      wake() { ctxA(); },
      ok() { tone(523, 0, 0.12, 'triangle', 0.18); tone(784, 0.12, 0.22, 'triangle', 0.18); },
      no() { tone(330, 0, 0.18, 'sawtooth', 0.08, 262); tone(262, 0.18, 0.3, 'sawtooth', 0.08, 196); },
      horn() { tone(110, 0, 0.9, 'sawtooth', 0.12, 104); tone(165, 0, 0.9, 'square', 0.04, 156); },
      whoosh() { noise(0, 0.8, 0.25, 300, 2400); },
      click() { tone(1800, 0, 0.025, 'square', 0.06); },
      final(fr) {
        if (fr === 1) { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.25, 'triangle', 0.18)); tone(1047, 0.55, 0.6, 'triangle', 0.18); }
        else if (fr >= 0.7) { [523, 659, 784].forEach((f, i) => tone(f, i * 0.14, 0.3, 'triangle', 0.16)); }
        else if (fr >= 0.4) { tone(392, 0, 0.3, 'triangle', 0.14); tone(330, 0.3, 0.5, 'triangle', 0.14); }
        else { [294, 277, 262, 247].forEach((f, i) => tone(f, i * 0.35, 0.5, 'sawtooth', 0.07, f * 0.94)); } // the trombone
      }
    };
  })();
  const sndBtn = document.getElementById('sndBtn');
  if (sndBtn) { const paint = () => { sndBtn.textContent = snd.on ? '🔊' : '🔇'; sndBtn.setAttribute('aria-label', snd.on ? 'Sound on. Tap to mute' : 'Sound off. Tap to unmute'); }; paint(); sndBtn.addEventListener('click', () => { snd.toggle(); paint(); }); }
  const inDom = (x, y, m) => { const d = ROUNDS[R].dom; return x > d.x0 - m && x < d.x1 + m && y > d.y0 - m && y < d.y1 + m; };

  function arrow(x, y, ux, uy, len, col) {
    const ang = Math.atan2(-uy, ux), X = sx(x), Y = sy(y), ex = X + len * Math.cos(ang), ey = Y + len * Math.sin(ang);
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(ex, ey); ctx.stroke();
    const h = Math.min(6, len * 0.45);
    ctx.beginPath(); ctx.moveTo(ex, ey);
    ctx.lineTo(ex - h * Math.cos(ang - 0.45), ey - h * Math.sin(ang - 0.45)); ctx.lineTo(ex - h * Math.cos(ang + 0.45), ey - h * Math.sin(ang + 0.45));

  }
  function streamline(p) {
    const r = ROUNDS[R], ds = (r.dom.x1 - r.dom.x0) / 300, out = [];
    for (const dir of [-1, 1]) {
      let x = p.x, y = p.y; const seg = [[x, y]];
      const f = (a, b) => { const v = r.vel(a, b), n = Math.hypot(v[0], v[1]) || 1; return [dir * v[0] / n, dir * v[1] / n]; };
      for (let i = 0; i < 900; i++) {
        const k1 = f(x, y), k2 = f(x + ds / 2 * k1[0], y + ds / 2 * k1[1]), k3 = f(x + ds / 2 * k2[0], y + ds / 2 * k2[1]), k4 = f(x + ds * k3[0], y + ds * k3[1]);
        x += ds / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]); y += ds / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
        seg.push([x, y]); if (!inDom(x, y, 0.1) || (r.walls && Math.abs(y) >= 1)) break;
        if (i > 20 && Math.hypot(x - p.x, y - p.y) < ds) break;
      }
      out.push(seg);
    }
    return out;
  }
  function polyline(pts) { ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(sx(q[0]), sy(q[1])) : ctx.moveTo(sx(q[0]), sy(q[1]))); ctx.stroke(); }

  function paddle(x, y, theta, col) {
    const X = sx(x), Y = sy(y), L = Math.max(14, 0.22 * scale);
    ctx.save(); ctx.translate(X, Y); ctx.rotate(-theta);
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, 0); ctx.stroke(); ctx.rotate(PI / 2); }
    // one blade marked, so a non-spinning paddle is visibly not spinning
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(L, 0, 4.5, 0, 2 * PI); ctx.fill();
    ctx.fillStyle = css('--surface'); ctx.beginPath(); ctx.arc(0, 0, 4, 0, 2 * PI); ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  function draw() {
    const r = ROUNDS[R], d = r.dom, cFlow = css('--flow'), cPad = css('--paddle'), cLine = css('--line'), cWall = css('--wall');
    ctx.clearRect(0, 0, W, H);
    if (r.walls) {
      ctx.fillStyle = cWall; ctx.globalAlpha = 0.25;
      ctx.fillRect(0, 0, W, sy(1)); ctx.fillRect(0, sy(-1), W, H - sy(-1)); ctx.globalAlpha = 1;
      ctx.strokeStyle = cWall; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, sy(1)); ctx.lineTo(W, sy(1)); ctx.moveTo(0, sy(-1)); ctx.lineTo(W, sy(-1)); ctx.stroke();
    } else {
      ctx.strokeStyle = cLine; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(d.x0), sy(0)); ctx.lineTo(sx(d.x1), sy(0)); ctx.moveTo(sx(0), sy(d.y0)); ctx.lineTo(sx(0), sy(d.y1)); ctx.stroke();
    }
    // arrows
    const n = 8, cell = Math.min(W, H) / n;
    let umax = 0; const pts = [];
    for (let i = 0; i < Math.ceil(W / cell); i++) for (let j = 0; j < Math.ceil(H / cell); j++) {
      const x = d.x0 + (i + 0.5) * cell / scale, y = d.y1 - (j + 0.5) * cell / scale;
      if (r.walls && Math.abs(y) >= 1) continue;
      const v = r.vel(x, y), m = Math.hypot(v[0], v[1]);
      if (m > 1e-9 && m < 6) { pts.push([x, y, v, m]); umax = Math.max(umax, Math.min(m, 2.5)); }
    }
    ctx.globalAlpha = 0.45;
    pts.forEach(([x, y, v, m]) => arrow(x, y, v[0], v[1], cell * 0.7 * Math.min(m, 2.5) / umax, cFlow));
    ctx.globalAlpha = 1;
    // streamline through the paddle's start
    ctx.strokeStyle = cFlow; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]); ctx.globalAlpha = 0.8;
    streamline(st.pos).forEach(s => polyline(s)); ctx.setLineDash([]); ctx.globalAlpha = 1;
    // trail and paddle
    if (st.trail.length > 1) { ctx.strokeStyle = cPad; ctx.globalAlpha = 0.35; ctx.lineWidth = 2; polyline(st.trail); ctx.globalAlpha = 1; }
    paddle(st.p.x, st.p.y, st.theta, cPad);
    $('hint').textContent = st.phase === 'predict' ? (r.place ? 'Tap to place the paddle' : 'Dashed: the streamline through the paddle') : st.phase === 'run' ? 'turned ' + (st.theta / (2 * PI)).toFixed(2) + ' rev' : 'turned ' + (st.theta / (2 * PI)).toFixed(2) + ' rev';
  }

  // ---------- UI ----------
  function renderDots() {
    const box = $('dots'); box.innerHTML = '';
    ROUNDS.forEach((_, i) => { const e = document.createElement('span'); e.className = 'dot'; e.dataset.s = results[i] === null ? (i === R ? 'now' : '') : results[i] ? 'right' : 'wrong'; box.append(e); });
    $('total').textContent = results.reduce((a, s) => a + (s ? 10 : 0), 0);
  }
  function showFinal(on) { for (const sel of ['#stage', '.legend', '#brief', '.ckey', '.graphs', '#pill']) document.querySelectorAll(sel).forEach(e => e.hidden = on); if (on) { $('title').textContent = 'Finished'; window.scrollTo(0, 0); } }
  function load(i) {
    R = i; st = fresh(); const r = ROUNDS[R];
    $('final').hidden = true; $('card').hidden = false; showFinal(false);
    $('title').textContent = 'Round ' + (R + 1) + ': ' + r.title; $('brief').innerHTML = r.brief;
    $('q').textContent = r.place ? 'Where you placed it, will the paddle spin?' : 'Will the paddle spin?';
    document.querySelectorAll('.choice').forEach(b => { b.setAttribute('aria-pressed', 'false'); b.className = 'choice'; b.disabled = false; });
    $('go').disabled = true; $('go').hidden = false; $('next').hidden = true;
    $('result').textContent = ''; $('result').className = 'result'; $('debrief').hidden = true; $('debrief').innerHTML = '';
    renderDots(); size(); typeset([$('brief')]);
  }
  document.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
    if (st.phase !== 'predict') return;
    document.querySelectorAll('.choice').forEach(c => c.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true'); st.choice = +b.dataset.v; $('go').disabled = false;
  }));
  cv.addEventListener('pointerdown', e => {
    const r = ROUNDS[R]; if (!r.place || st.phase !== 'predict') return;
    const rect = cv.getBoundingClientRect();
    let y = r.dom.y1 - (e.clientY - rect.top) / scale; y = Math.max(-0.95, Math.min(0.95, Math.round(y * 20) / 20));
    st.pos = { x: r.pos.x, y }; st.p = { ...st.pos }; draw();
  });

  $('go').addEventListener('click', () => {
    if (st.phase !== 'predict' || st.choice === null) return;
    const r = ROUNDS[R]; st.phase = 'run'; st.t = 0; st.p = { ...st.pos }; st.theta = 0; st.trail = [[st.p.x, st.p.y]];
    $('go').disabled = true; document.querySelectorAll('.choice').forEach(c => c.disabled = true);
    snd.wake();
    let last = performance.now();
    function step(now) {
      const real = Math.min(0.05, (now - last) / 1000); last = now;
      const dt = reduceMotion ? r.T : real * r.speed, sub = Math.max(1, Math.ceil(dt / 0.004)), h = dt / sub;
      for (let k = 0; k < sub; k++) {
        // RK4 for position; theta advances at omega/2
        const f = (x, y) => r.vel(x, y); let { x, y } = st.p;
        const k1 = f(x, y), k2 = f(x + h / 2 * k1[0], y + h / 2 * k1[1]), k3 = f(x + h / 2 * k2[0], y + h / 2 * k2[1]), k4 = f(x + h * k3[0], y + h * k3[1]);
        const q0 = Math.floor(st.theta / (PI / 2)); st.theta += h * 0.5 * r.omega(x, y); if (Math.floor(st.theta / (PI / 2)) !== q0) snd.click();
        st.p = { x: x + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]), y: y + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) };
        st.t += h;
      }
      st.trail.push([st.p.x, st.p.y]); draw();
      if (st.t < r.T && inDom(st.p.x, st.p.y, -0.1)) requestAnimationFrame(step); else finish();
    }
    requestAnimationFrame(step);
  });

  function finish() {
    st.phase = 'done'; const r = ROUNDS[R];
    const w = r.omega(st.pos.x, st.pos.y), truth = Math.abs(w) < 1e-9 ? 0 : Math.sign(w);
    const ok = st.choice === truth; results[R] = ok; if (ok) snd.ok(); else snd.no();
    document.querySelectorAll('.choice').forEach(c => { if (+c.dataset.v === truth) c.classList.add('right'); else if (+c.dataset.v === st.choice) c.classList.add('wrong'); });
    const wtxt = r.wtxt ? r.wtxt : r.place ? '\\(\\omega=2y=' + w.toFixed(1) + '\\) at \\(y=' + st.pos.y.toFixed(2) + '\\). ' : '\\(\\omega=' + w + '\\). ';
    $('result').innerHTML = (ok ? 'Right. ' : 'Not this time. ') + wtxt + 'The paddle turned ' + (st.theta / (2 * PI)).toFixed(2) + ' revolutions.';
    $('result').className = 'result ' + (ok ? 'ok' : 'no');
    const db = $('debrief'); db.innerHTML = r.debrief.map(s => '<p>' + s + '</p>').join(''); db.hidden = false;
    $('go').hidden = true; $('next').hidden = false; $('next').textContent = R < ROUNDS.length - 1 ? 'Next round' : 'See total';
    renderDots(); typeset([$('result'), db]);
  }
  $('next').addEventListener('click', () => {
    if (R < ROUNDS.length - 1) load(R + 1);
    else {
      const tot = results.reduce((a, s) => a + (s ? 10 : 0), 0), fr = tot / (ROUNDS.length * 10);
      const v = fr === 1 ? ['🎡', ''] : fr >= 0.7 ? ['🌀', ''] : fr >= 0.4 ? ['🫨', ''] : ['🧭', ''];
      $('emo').textContent = v[0]; $('emo').className = 'emo' + (fr >= 0.7 ? ' spin' : ''); 
      $('card').hidden = true; $('final').hidden = false; showFinal(true); snd.final(fr); $('finalScore').textContent = tot; typeset([$('final')]);
    }
  });
  $('again').addEventListener('click', () => { results = ROUNDS.map(() => null); load(0); });

  window.addEventListener('resize', size);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  st = fresh(); load(0);
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(() => typeset([document.querySelector('.app')]));
})();
</script>
</body></html>
