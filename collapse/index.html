<div class="app">

</div>

<script>
(function () {

  const ROUNDS = [
    { title: 'The started plate', brief: 'A plate under deep fluid starts moving at speed \\(U\\) at \\(t=0\\). The five curves are the velocity profiles \\(u(y)\\) at five times. Pick the axes that make them fall onto a single curve.',
      profiles: () => TIMES.map(t => ({ t, y: Array.from({ length: 121 }, (_, i) => i * 0.05), u: Array.from({ length: 121 }, (_, i) => erfc(i * 0.05 / (2 * Math.sqrt(NU * t)))) })),
      opts: [{ k: '\\(u/U\\) against \\(y/\\sqrt{\\nu t}\\)', v: 'sqrt', ok: true }, { k: '\\(u/U\\) against \\(y/\\nu t\\)', v: 'lin' }, { k: '\\(u/U\\) against \\(y/t\\)', v: 'yt' }, { k: '\\(u/U\\) against \\(y\\sqrt{\\nu t}\\)', v: 'mul' }],

    { title: 'A plate that keeps accelerating', brief: 'Now the plate speed grows in time, \\(U(t)=At\\). Five profiles again. Which axes collapse them?',

      opts: [{ k: '\\(u/A\\) against \\(y/\\sqrt{\\nu t}\\)', v: 'a' }, { k: '\\(u/(At)\\) against \\(y/\\sqrt{\\nu t}\\)', v: 'b', ok: true }, { k: '\\(u/(At)\\) against \\(y/\\nu t\\)', v: 'c' }, { k: 'None: the plate speed changes, so no collapse', v: 'd' }],
      ux: { a: (y, t) => y / Math.sqrt(NU * t), b: (y, t) => y / Math.sqrt(NU * t), c: (y, t) => y / (NU * t), d: (y, t) => y }, uy: (u, t, v) => v === 'a' ? u / 4 : v === 'd' ? u / 4 : u / t, xmax: { a: 4, b: 4, c: 8, d: 6 },
      debrief: ['\\(u/(At)\\) against \\(y/\\sqrt{\\nu t}\\). The velocity scale is now the plate\'s current speed \\(At\\), and the length scale is still \\(\\sqrt{\\nu t}\\): with both rescaled, the profiles coincide.', 'Similarity does not need a constant plate speed. It needs the problem to have no length scale of its own, and a time dependence that a stretch can absorb.'] },
    { title: 'Flow starting in a channel', brief: 'A pump is switched on in a channel of width \\(H\\) at \\(t=0\\). The five curves are the profiles across the channel at five times. Which axes collapse them?',
      profiles: () => { const d = diffuse(2, 160, t => 0, 1, [0.05, 0.1, 0.2, 0.4, 0.8]); return [0.05, 0.1, 0.2, 0.4, 0.8].map(t => ({ t, y: d[t].y, u: d[t].u })); },
      opts: [{ k: '\\(u/u_{\\max}(t)\\) against \\(y/\\sqrt{\\nu t}\\)', v: 'a' }, { k: '\\(u/u_{\\max}(t)\\) against \\(y/H\\)', v: 'b' }, { k: '\\(u/(Gt)\\) against \\(y/\\sqrt{\\nu t}\\)', v: 'c' }, { k: 'None of these', v: 'd', ok: true }],
      ux: { a: (y, t) => y / Math.sqrt(NU * t), b: (y, t) => y / 2, c: (y, t) => y / Math.sqrt(NU * t), d: (y, t) => y / 2 }, uy: (u, t, v, umax) => v === 'c' ? u / t : u / umax, xmax: { a: 4, b: 1, c: 4, d: 1 },

  ];
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');

  const COLS = ['--c1', '--c2', '--c3', '--c4', '--c5'], DASH = [[], [8, 4], [3, 3], [8, 3, 3, 3], [1, 3]];

      ok() { tone(523, 0, 0.12, 'triangle', 0.18); tone(784, 0.12, 0.22, 'triangle', 0.18); },

      zip(up) { tone(up ? 300 : 900, 0, 0.5, 'sine', 0.1, up ? 1200 : 300); },

  const sndBtn = $('sndBtn'); const paintSnd = () => { sndBtn.textContent = snd.on ? '🔊' : '🔇'; sndBtn.setAttribute('aria-label', snd.on ? 'Sound on. Tap to mute' : 'Sound off. Tap to unmute'); };
  paintSnd(); sndBtn.addEventListener('click', () => { snd.toggle(); paintSnd(); });
  function typeset(els) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(els).catch(() => {}); }

  function size() { W = stage.clientWidth; H = Math.round(Math.min(300, Math.max(220, W * 0.72))); const dpr = window.devicePixelRatio || 1; cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(); }

    const db = $('debrief'); db.innerHTML = r.debrief.map(s => '<p>' + s + '</p>').join(''); db.hidden = false;
