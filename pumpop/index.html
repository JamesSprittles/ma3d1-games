}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.4; }

.dots { display: flex; gap: 6px; }

<script>
(function () {

  const Q0 = Math.PI / 8;                     // flux at R = 1, G = 1, mu = 1

  const LEVELS = [

      brief: 'You are the heart. Keep the blood flow through this artery inside the green band by driving the pressure. The vessel is small, so the flow answers the pump at once. Things will happen to the artery.',

      ok() { tone(523, 0, 0.12, 'triangle', 0.18); tone(784, 0.12, 0.22, 'triangle', 0.18); },
      mid() { tone(440, 0, 0.15, 'triangle', 0.15); tone(523, 0.15, 0.25, 'triangle', 0.15); },
      no() { tone(330, 0, 0.18, 'sawtooth', 0.08, 262); tone(262, 0.18, 0.3, 'sawtooth', 0.08, 196); },
      alarm() { tone(880, 0, 0.12, 'square', 0.12); tone(660, 0.14, 0.12, 'square', 0.12); tone(880, 0.28, 0.12, 'square', 0.12); },
      relief() { tone(660, 0, 0.12, 'triangle', 0.12); tone(880, 0.12, 0.2, 'triangle', 0.12); },
      beat() { tone(60, 0, 0.09, 'sine', 0.25, 40); },
      final(fr) {
        if (fr >= 0.9) { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.25, 'triangle', 0.18)); tone(1047, 0.55, 0.6, 'triangle', 0.18); }

        else if (fr >= 0.3) { tone(392, 0, 0.3, 'triangle', 0.14); tone(330, 0.3, 0.5, 'triangle', 0.14); }

  }
  const labels = [];
  function makeLabels() { stage.querySelectorAll('.lab').forEach(e => e.remove()); labels.length = 0; const add = (tex, k) => { const e = document.createElement('div'); e.className = 'lab'; e.dataset.k = k; e.innerHTML = tex; stage.append(e); labels.push(e); }; add('\\(w(r)\\)', 'w'); add('\\(Q/Q_0\\)', 'q'); typeset(labels); placeLabels(); }
  function placeLabels() { labels.forEach(e => { if (e.dataset.k === 'w') { e.style.left = (W * 0.6 - 30) + 'px'; e.style.top = (H / 2 + 0.36 * H * 0.55) + 'px'; } else { e.style.left = (W * 0.76 - 8) + 'px'; e.style.top = '10px'; } }); }
  function renderDots() { const box = $('dots'); box.innerHTML = ''; LEVELS.forEach((_, i) => { const e = document.createElement('span'); e.className = 'dot'; e.dataset.s = results[i] === null ? (i === L ? 'now' : '') : results[i] >= 8 ? 'right' : results[i] >= 4 ? 'half' : 'wrong'; box.append(e); }); $('total').textContent = results.reduce((a, s) => a + (s || 0), 0); }
  function fresh() { const lv = LEVELS[L]; const pipe = Pipe(); pipe.setSteady(); return { phase: 'ready', pipe, t: -1, q: 1, hist: [], inb: 0, total: 0, events: lv.events.map(e => ({ ...e, fired: false })), R: 1, mu: 1 }; }
  function load(i) {
    runId++; L = i; st = fresh(); const lv = LEVELS[L];
    $('final').hidden = true; $('card').hidden = false; $('stage').hidden = false; $('ctl').hidden = false; $('stripbox').hidden = false; $('brief').hidden = false; $('banner').hidden = true;
    $('title').textContent = lv.title; $('brief').innerHTML = lv.brief; $('G').value = 1; $('G').disabled = false; $('gval').textContent = '1.00';
    $('go').hidden = false; $('go').disabled = false; $('next').hidden = true; $('result').textContent = ''; $('result').className = 'result'; $('debrief').hidden = true; $('debrief').innerHTML = '';
    $('glab').innerHTML = '\\(-\\mathrm{d}p/\\mathrm{d}z\\), in units of the start value'; renderDots(); size(); makeLabels(); typeset([$('brief'), $('glab'), $('striplab')]);
  }
  $('G').addEventListener('input', () => { const v = parseFloat($('G').value); st.pipe.G = v; $('gval').textContent = v.toFixed(2); });
  let bannerTimer = null;
  function banner(text, ok) { const b = $('banner'); b.textContent = text; b.className = 'banner' + (ok ? ' ok' : ''); b.hidden = false; clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { b.hidden = true; }, 3200); if (ok) snd.relief(); else snd.alarm(); if (navigator.vibrate) navigator.vibrate(ok ? [60] : [120, 60, 120]); }
  $('go').addEventListener('click', () => {
    if (st.phase !== 'ready') return; snd.warm(); st.phase = 'run'; $('go').disabled = true; const lv = LEVELS[L]; const myRun = ++runId;
    let last = performance.now(), lastBeat = 0; st.t = 0;
    function frame(now) {
      if (myRun !== runId) return;
      const real = Math.min(0.05, (now - last) / 1000); last = now; st.t += real;
      st.events.forEach(e => { if (!e.fired && st.t >= e.t) { e.fired = true; if (e.R !== undefined) { st.pipe.setR(e.R); st.R = e.R; } if (e.mu !== undefined) { st.pipe.nu = e.mu; st.mu = e.mu; } banner(e.text, e.ok); } });
      // advance the pipe: dimensionless time runs at 1/lag per real second; several substeps for accuracy
      const dtau = real / lv.lag, sub = Math.max(1, Math.ceil(dtau / 0.02)); for (let k = 0; k < sub; k++) st.pipe.step(dtau / sub);
      st.q = st.pipe.flux() / Q0; const inb = st.q >= lv.band[0] && st.q <= lv.band[1]; st.total += real; if (inb) st.inb += real;
      if (st.hist.length === 0 || st.t - st.hist[st.hist.length - 1][0] > 0.1) st.hist.push([st.t, st.q, st.pipe.G]);
      if (L === 0 && inb && st.t - lastBeat > 0.8) { lastBeat = st.t; snd.beat(); }
      draw();
      if (st.t < LEN) requestAnimationFrame(frame); else finish();
    }
    requestAnimationFrame(frame);
  });
  function finish() {
    st.phase = 'done'; $('G').disabled = true; const lv = LEVELS[L]; const fr = st.inb / st.total, score = Math.round(10 * fr); results[L] = score;
    if (score >= 8) snd.ok(); else if (score >= 4) snd.mid(); else snd.no();
    $('result').innerHTML = (score >= 8 ? 'Steady hands. ' : score >= 4 ? 'Not bad. ' : 'Rough shift. ') + 'In the band ' + (100 * fr).toFixed(0) + '% of the time · +' + score;
    $('result').className = 'result ' + (score >= 8 ? 'ok' : score >= 4 ? 'mid' : 'no');
    // the table needs the cumulative (R, mu) after each event
    let R = 1, mu = 1; const ev = lv.events.map(e => { if (e.R !== undefined) R = e.R; if (e.mu !== undefined) mu = e.mu; return { text: e.text, R, mu }; });
    const db = $('debrief'); db.innerHTML = lv.debrief(ev).map(s => s.startsWith('<table') ? s : '<p>' + s + '</p>').join(''); db.hidden = false;
    $('go').hidden = true; $('next').hidden = false; $('next').textContent = L < LEVELS.length - 1 ? 'Next level' : 'See total';
    renderDots(); draw(); typeset([db, $('result')]);
  }
  $('next').addEventListener('click', () => {
    if (L < LEVELS.length - 1) load(L + 1);
    else { const tot = results.reduce((a, s) => a + (s || 0), 0), fr = tot / (LEVELS.length * 10);
      $('emo').textContent = fr >= 0.9 ? '🏆🫀' : fr >= 0.6 ? '🫀' : fr >= 0.3 ? '🩺' : '🚑'; $('emo').className = 'emo' + (fr >= 0.6 ? ' beat' : '');
      $('card').hidden = true; $('stage').hidden = true; $('ctl').hidden = true; $('stripbox').hidden = true; $('brief').hidden = true; $('final').hidden = false; $('title').textContent = 'Shift over'; snd.final(fr); $('finalScore').textContent = tot; window.scrollTo(0, 0); }
  });
  $('again').addEventListener('click', () => { results = LEVELS.map(() => null); load(0); });
  window.addEventListener('resize', size);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  load(0);
  if (window.MathJax && MathJax.startup && MathJax.startup.promise) MathJax.startup.promise.then(() => typeset([document.querySelector('.app')]));
})();
</script>
